<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'fontwar';
            src: url(fonts/Capture\ it.ttf) format('truetype'), url() format();
            font-weight: normal;
            font-style: normal;

            /*
                Tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                - truetype-aat (Apple Advanced Typography)
                - svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'fontwar', Times, serif;
            font-size: 2em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Call of Duty Black Ops 2</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus aspernatur libero sed hic aliquam non recusandae quisquam adipisci accusantium. Dolores veniam dolore porro omnis eos non eligendi, quibusdam adipisci distinctio?</p>
</body>
</html>
